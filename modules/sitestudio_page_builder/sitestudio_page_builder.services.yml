services:
  eventsubscriber:
    class: '\Drupal\sitestudio_page_builder\EventSubscriber\SitestudioPageBuilderEventSubscriber'
    arguments:
      - '@entity_type.manager'
      - '@current_user'
      - '@current_route_match'
      - '@request_stack'
      - '@library.discovery'
      - '@sitestudio_page_builder.manager'
      - '@module_handler'
      - '@cohesion.utils'
      - '@cohesion.api_client'
      - '@entity.repository'
      - '@file_url_generator'
    tags:
      - { name: 'event_subscriber' }
    calls:
      - [setModerationInformation, ['@?content_moderation.moderation_information', '@?content_moderation.state_transition_validation']]

  sitestudio_page_builder.manager:
    class: Drupal\sitestudio_page_builder\Services\SitestudioPageBuilderManager
    arguments: ['@cohesion_current_route_match']

  Drupal\sitestudio_page_builder\Hook\SiteStudioPageBuilderHooks:
    class: Drupal\sitestudio_page_builder\Hook\SiteStudioPageBuilderHooks
    autowire: true
    arguments:
      - '@current_route_match'
      - '@current_user'
      - '@request_stack'
      - '@router.admin_context'
      - '@language_manager'
      - '@plugin.manager.editor'
      - '@renderer'
      - '@cohesion.utils'
      - '@cohesion_image_browser.update_manager'
      - '@event_dispatcher'
      - '@settings.endpoint.utils'
      - '@keyvalue'
      - '@custom.elements'
      - '@sitestudio_page_builder.manager'
      - '@entity_type.manager'
